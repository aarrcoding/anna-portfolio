<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anna Rudina — Portfolio</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="description" content="Anna Rudina — visual content, social media, marketplace listings and presentations. Seoul.">
<meta property="og:type" content="website">
<meta property="og:title" content="Anna Rudina — Portfolio">
<meta property="og:description" content="Visual content, social media, marketplace listings and presentations.">
<meta property="og:image" content="https://anna-portfolio-idi9.netlify.app/assets/og-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://anna-portfolio-idi9.netlify.app/assets/og-preview.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --graphite:#232323;      /* Carbon Black */
  --graphite-2:#323232;
  --cream:#FAFEEB;         /* Ivory */
  --gold:#F3FF83;          /* Lime Cream */
  --sky:#DDF0FF;           /* Maya Blue, light tint */
  --sky-deep:#A9D8FF;      /* Maya Blue, soft */
  --rose:#69BEFF;          /* Maya Blue (main accent) */
  --sage:#E3F5A0;          /* Lime, muted */
  --lilac:#B8DEFF;         /* Maya Blue, pale */
  --blue-dark:#1f5f99;     /* Maya Blue, dark shade */
  --ink:#232323;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,sans-serif;background:var(--graphite);overflow-x:hidden;color:var(--ink);line-height:1.55}
.page{max-width:1100px;margin:0 auto;background:var(--cream)}
a{color:inherit}

/* ---------- HERO ---------- */
.hero{background:var(--graphite);color:var(--sky);position:relative;padding:28px 20px 90px;overflow:hidden}
.nav{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;font-size:12px;letter-spacing:.04em}
.nav a{text-decoration:none;opacity:.85;transition:.2s}
.nav a:hover{opacity:1;color:var(--gold)}
.hero h1{font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(36px,13vw,150px);color:var(--rose);text-align:center;letter-spacing:-.04em;line-height:1;margin-top:30px;position:relative;z-index:3}
.desk{position:relative;width:min(440px,92%);margin:62px auto 0;height:490px}
.sheet{position:absolute;inset:0;background:#f4f4f1;border-radius:16px 16px 3px 3px;box-shadow:0 18px 36px #0007}
.sheet::after{content:"";position:absolute;inset:0;border-radius:inherit;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='a'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .27  0 0 0 0 .2  0 0 0 .5 0'/></filter><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012 .02' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .35 0'/></filter><rect width='100%25' height='100%25' filter='url(%23a)'/><rect width='100%25' height='100%25' filter='url(%23b)'/></svg>");opacity:.28;mix-blend-mode:multiply;pointer-events:none}
.sheet.s2{transform:rotate(-4deg) translate(-26px,6px);background:#fbfbfa}
.sheet.s3{transform:rotate(3deg) translate(22px,2px);background:#ececea}
.sheet .hole{position:absolute;left:14px;width:12px;height:12px;border-radius:50%;background:var(--graphite)}
.binder{position:absolute;left:50%;top:-66px;width:74px;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 4px 5px #0006);pointer-events:none}
.polaroid img.tape{position:absolute;width:92px;aspect-ratio:auto;background:none;object-fit:contain;height:auto;z-index:3;filter:drop-shadow(0 1px 1px #0003);pointer-events:none}
.tape.l{left:-38px;top:2px;transform:rotate(-40deg)}
.tape.r{right:-38px;top:2px;transform:rotate(40deg)}
.polaroid{position:absolute;left:50%;top:64px;transform:translateX(-50%) rotate(-1.5deg);width:230px;background:#fdfff4;padding:12px 12px 40px;box-shadow:0 8px 20px #0004;z-index:2}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sky-deep)}

.tagline{position:absolute;left:36px;right:36px;top:360px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--graphite);z-index:2}
.corner{position:absolute;bottom:28px;font-weight:700;font-size:14px;color:#fff}
.corner.l{left:40px}.corner.r{right:40px}
.hello{position:absolute;right:6%;top:40%;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500;font-size:18px;color:var(--gold);transform:rotate(-6deg);z-index:3}
@media(max-width:760px){.hello{display:none}}

@media(max-width:420px){.polaroid{width:190px}.tagline{font-size:10px;left:20px;right:12px;top:310px}.desk{height:450px}}

.burger{display:none;position:absolute;top:18px;right:18px;z-index:10;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--sky);background:transparent;cursor:pointer}
.burger span,.burger span::before,.burger span::after{display:block;width:18px;height:2px;background:var(--sky);position:absolute;left:12px;transition:.25s}
.burger span{top:20px}.burger span::before{content:"";top:-6px;left:0}.burger span::after{content:"";top:6px;left:0}
.burger.on span{background:transparent}.burger.on span::before{top:0;transform:rotate(45deg)}.burger.on span::after{top:0;transform:rotate(-45deg)}
@media(max-width:760px){
  .burger{display:block}
  .nav{display:none;position:absolute;top:0;left:0;right:0;z-index:9;flex-direction:column;align-items:center;gap:18px;background:var(--graphite);padding:76px 20px 28px;font-size:16px}
  .nav.on{display:flex}
  .hero h1{margin-top:44px}
}

/* ---------- TABS ---------- */
.tabs{display:flex;align-items:flex-end;background:var(--graphite);margin-top:-1px}
.tab{flex:1;border:0;cursor:pointer;font-family:Unbounded,sans-serif;font-size:clamp(13px,2.4vw,22px);padding:22px 8px 14px;background:var(--sky-deep);color:#fff;text-transform:uppercase;border-radius:26px 26px 0 0;transition:.25s}
.tab:nth-child(1){margin-right:-18px}
.tab:nth-child(3){margin-left:-18px}
.tab.on{background:var(--cream);color:var(--graphite);padding-top:30px;position:relative;z-index:2}
.tab:not(.on):hover{background:var(--sage)}
.panel{display:none;padding:56px 56px 40px;animation:fade .4s}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:640px){.panel{padding:40px 22px 24px}}

h2.script{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:34px;letter-spacing:-.02em;color:var(--graphite);line-height:1.1;margin-bottom:18px;text-transform:capitalize}

/* ---------- ABOUT ---------- */
.about{display:grid;grid-template-columns:260px 1fr;gap:48px;align-items:start}
@media(max-width:760px){.about{grid-template-columns:1fr}}
.frame{position:relative;background:var(--rose);padding:6px;transform:rotate(-3deg);box-shadow:0 10px 24px #0002;max-width:260px}
.frame img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.frame 
.about p{margin-bottom:14px;max-width:560px}
.about b.hi{background:linear-gradient(transparent 60%,var(--gold) 60%)}
.contacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.pill{background:var(--sky);border:1.5px solid var(--graphite);border-radius:999px;padding:8px 18px;font-size:13px;text-decoration:none;transition:.2s}
.pill:hover{background:var(--graphite);color:var(--cream)}

hr.soft{border:0;border-top:1px solid #0001;margin:48px 0}

/* ---------- SKILLS ---------- */
.skills{display:grid;grid-template-columns:150px 1fr 1fr;gap:20px 40px}
@media(max-width:760px){.skills{grid-template-columns:1fr}}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sk{display:flex;gap:10px;margin-bottom:18px;font-size:14px}
.sk .n{font-weight:700;color:var(--rose)}
.sk h4{font-size:15px}
.sk p{font-size:13px;opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:20px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.two h3{font-family:Unbounded,sans-serif;font-weight:500;font-size:20px;color:var(--blue-dark);margin-bottom:10px}
.two li{list-style:none;font-size:14px;padding:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:5px 14px;font-size:13px;background:var(--graphite);color:var(--cream)}


/* ---------- TIMELINE / EDU ---------- */
.item{background:#fff8;border-left:4px solid var(--sky-deep);border-radius:0 14px 14px 0;padding:18px 22px;margin-bottom:18px}
.item.gold{border-color:var(--gold)}.item.rose{border-color:var(--rose)}
.item h3{font-size:17px}
.item .meta{font-family:"JetBrains Mono",monospace;font-size:12px;opacity:.7;margin:2px 0 8px}
.item p{font-size:14px;max-width:680px}

/* ---------- PROJECTS ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.card{border-radius:18px;padding:22px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;transition:.3s;position:relative}
.card:hover{transform:translateY(-6px) rotate(-1deg)}
.card:nth-child(1){background:var(--sky)}.card:nth-child(2){background:var(--lilac)}
.card:nth-child(3){background:var(--sage)}.card:nth-child(4){background:var(--gold)}
.card:nth-child(5){background:var(--rose)}.card:nth-child(6){background:var(--graphite);color:var(--sky)}
.card small{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.7}
.card h3{font-family:Unbounded,sans-serif;font-weight:500;font-size:18px;margin:6px 0}
.card p{font-size:13px}
.card .soon{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;align-self:flex-end}


/* ---------- GALLERY ---------- */
.lead{font-size:14px;max-width:560px;margin:-4px 0 26px;opacity:.8}
.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))!important;gap:20px!important}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;border-radius:18px;padding:12px 12px 16px;display:block;transition:.3s;position:relative}
.pcard:hover{transform:translateY(-6px) rotate(-1deg)}
.pcard:focus-visible{outline:3px solid var(--graphite)}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:#fff}
.pcard h3{font-family:Unbounded,sans-serif;font-weight:500;font-size:15px;margin:12px 4px 2px}
.pcard small{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.7;margin:0 4px;display:block}
.pcard:nth-child(5n+1){background:var(--sky)}.pcard:nth-child(5n+2){background:var(--lilac)}
.pcard:nth-child(5n+3){background:var(--sage)}.pcard:nth-child(5n+4){background:var(--gold)}.pcard:nth-child(5n){background:var(--rose)}
.modal{position:fixed;inset:0;background:#232323ee;z-index:50;display:none;overflow-y:auto;padding:20px}
.modal.on{display:block}
.mbox{max-width:1000px;margin:0 auto;background:var(--cream);border-radius:22px;padding:24px 24px 32px;position:relative}
.mbox h2{font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(20px,4vw,30px);margin-bottom:14px;padding-right:50px}
.mclose{position:sticky;top:0;float:right;width:42px;height:42px;border-radius:50%;border:0;background:var(--graphite);color:var(--cream);font-size:20px;cursor:pointer;z-index:3}
.mtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.mtab{border:1.5px solid var(--graphite);background:transparent;border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;cursor:pointer}
.mtab.on{background:var(--graphite);color:var(--cream)}
.mimgs{display:grid;gap:14px}
.mimgs.listing{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.mimgs.col{max-width:900px;margin:0 auto;gap:0}
.mimgs.col.mob{max-width:430px}
.mimgs img{width:100%;display:block;border-radius:8px}
.mimgs.col img{border-radius:0}


/* neutral cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.ccard{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid #0000001a;border-radius:18px;padding:22px;min-height:210px;display:flex;flex-direction:column;transition:.3s;color:var(--ink)}
.ccard:hover{transform:translateY(-6px);box-shadow:0 12px 26px #0001}
.ccard small{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.6}
.ccard h3{font-family:Unbounded,sans-serif;font-weight:500;font-size:18px;margin:6px 0}
.ccard p{font-size:13px;opacity:.8;flex:1}
.ccard .soon{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:13px;align-self:flex-end;color:var(--graphite)}
.back{all:unset;cursor:pointer;font-size:13px;border:1.5px solid var(--graphite);border-radius:999px;padding:6px 16px;margin-bottom:14px;display:inline-block}
.back:hover{background:var(--graphite);color:var(--cream)}
.pcard{background:#fff!important;border:1px solid #0000001a}
.pcard:nth-child(n){background:#fff!important}


/* ---------- STATS ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;padding:0 56px 56px}
@media(max-width:640px){.stats{padding:0 22px 40px}}
.stat{background:var(--graphite);color:var(--cream);border-radius:20px;padding:22px;text-align:center}

.stat b{display:block;font-family:Unbounded,sans-serif;font-weight:500;font-size:34px}
.stat span{font-size:13px}

/* ---------- CONTACT ---------- */
.contact{background:var(--rose);margin:0;padding:64px 24px;text-align:center;position:relative;overflow:hidden}
.contact .env{max-width:520px;margin:0 auto;background:var(--cream);border:10px solid #fff;outline:2px dashed var(--graphite);outline-offset:-22px;padding:46px 30px;border-radius:6px;box-shadow:0 14px 30px #0002;transform:rotate(-1deg)}
.contact h2{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:34px;letter-spacing:-.02em;color:var(--graphite);line-height:1.1}
.contact p{margin:10px 0 20px;font-size:14px}
.btn{display:inline-block;background:var(--graphite);color:var(--cream);padding:12px 28px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;transition:.2s}
.btn:hover{background:var(--blue-dark)}
footer{background:var(--graphite);color:var(--sky);padding:22px 40px;font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

</style>
</head>
<body>
<div class="page">
<header class="hero" id="top">
  <button class="burger" aria-label="Menu" aria-expanded="false"><span></span></button>
  <nav class="nav">
    <a href="#work" data-tab="projects">social media</a>
    <a href="#work" data-tab="projects">marketplace listings</a>
    <a href="#work" data-tab="projects">presentations</a>
    <a href="#work" data-tab="projects">guides</a>
    <a href="#work" data-tab="projects">video</a>
    <a href="#work" data-tab="projects">web</a>
  </nav>
  <h1>Portfolio</h1>
  <div class="hello" data-t="hello"></div>
  <div class="desk">
    <div class="sheet s2"></div><div class="sheet s3"></div><div class="sheet"></div>
    <img class="binder" src="/assets/binder-clip.png" alt="">
    <div class="polaroid"><img class="tape l" src="/assets/tape.png" alt=""><img class="tape r" src="/assets/tape.png" alt=""><img id="heroPhoto" alt="Anna Rudina"></div>
    <div class="tagline" id="tagline"></div>
  </div>
  <div class="corner l" data-t="name"></div>
  <div class="corner r" data-t="year"></div>
</header>
<div class="tabs" id="work" role="tablist">
  <button class="tab" data-tab="edu">Education</button>
  <button class="tab on" data-tab="about">About me</button>
  <button class="tab" data-tab="projects">Projects</button>
</div>
<section class="panel on" id="about">
  <div class="about">
    <div class="frame"><img id="aboutPhoto" alt="Anna"></div>
    <div><div id="aboutText"></div><div class="contacts" id="contacts"></div></div>
  </div>
  <hr class="soft">
  <div class="skills"><div class="label">Key skills</div><div id="sk1"></div><div id="sk2"></div></div>
  <div class="two">
    <div><h3>SOFT SKILLS</h3><ul id="soft"></ul></div>
    <div><h3>SOFTWARE</h3><div class="chips" id="soft2"></div><h3 style="margin-top:22px">LANGUAGES</h3><div class="chips" id="langs"></div></div>
  </div>
  <hr class="soft">
  <h2 class="script">experience</h2><div id="exp"></div>
</section>
<section class="panel" id="edu"><h2 class="script">education</h2><div id="edul"></div></section>
<section class="panel" id="projects">
  <div id="cats"><h2 class="script">projects</h2><div class="cgrid" id="cgrid"></div></div>
  <div id="amazon" hidden>
    <button class="back" id="back">← all projects</button>
    <h2 class="script">amazon</h2><p class="lead" id="lead"></p><div class="grid" id="grid"></div>
  </div>
</section>
<div class="stats" id="stats"></div>
<section class="contact" id="contact"><div class="env"><h2 data-t="ctitle"></h2><p data-t="ctext"></p><a class="btn" id="cbtn"></a></div></section>
<footer><span data-t="fl"></span><span data-t="fr"></span></footer>
</div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<b class="hi">$1</b>');
const $=id=>document.getElementById(id);
const tabs=[...document.querySelectorAll('.tab')],panels=[...document.querySelectorAll('.panel')];
function show(id){tabs.forEach(t=>t.classList.toggle('on',t.dataset.tab===id));panels.forEach(p=>p.classList.toggle('on',p.id===id))}
tabs.forEach(t=>t.onclick=()=>show(t.dataset.tab));
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>show(a.dataset.tab));
const LABELS={listing:'Listing images',aplus:'A+ content · desktop',aplus_mobile:'A+ content · mobile',japan:'Japan version',tiktok:'TikTok'};
const KEYS=['listing','aplus','aplus_mobile','japan','tiktok'];
let DATA=[];
const modal=document.createElement('div');modal.className='modal';
modal.innerHTML='<div class="mbox"><button class="mclose" aria-label="Close">✕</button><h2></h2><div class="mtabs"></div><div class="mimgs"></div></div>';
document.body.appendChild(modal);
const mt=modal.querySelector('.mtabs'),mi=modal.querySelector('.mimgs');
function tab(d,k){
  mt.querySelectorAll('.mtab').forEach(t=>t.classList.toggle('on',t.dataset.k===k));
  mi.className='mimgs '+(k==='listing'||k==='tiktok'?'listing':'col'+(k==='aplus_mobile'?' mob':''));
  mi.innerHTML=d[k].map(u=>`<img loading="lazy" src="${esc(u)}" alt="${esc(d.name)} — ${LABELS[k]}">`).join('');
  modal.scrollTop=0;
}
function openM(i){
  const d=DATA[i];modal.querySelector('h2').textContent=d.name;mt.innerHTML='';
  const ks=KEYS.filter(k=>d[k]&&d[k].length);
  ks.forEach(k=>{const t=document.createElement('button');t.className='mtab';t.dataset.k=k;t.textContent=LABELS[k];t.onclick=()=>tab(d,k);mt.appendChild(t)});
  modal.classList.add('on');document.body.style.overflow='hidden';if(ks[0])tab(d,ks[0]);
}
function closeM(){modal.classList.remove('on');document.body.style.overflow=''}
modal.querySelector('.mclose').onclick=closeM;
modal.onclick=e=>{if(e.target===modal)closeM()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const cats=$('cats'),amz=$('amazon');
function openAmazon(){cats.hidden=true;amz.hidden=false;window.scrollTo({top:$('work').offsetTop,behavior:'smooth'})}
$('back').onclick=()=>{amz.hidden=true;cats.hidden=false};
const bg=document.querySelector('.burger'),nv=document.querySelector('.nav');
bg.onclick=()=>{const o=nv.classList.toggle('on');bg.classList.toggle('on',o);bg.setAttribute('aria-expanded',o)};
nv.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nv.classList.remove('on');bg.classList.remove('on')}));

function items(a){return (a||[]).map(e=>`<div class="item ${esc(e.color||'')}"><h3>${esc(e.title)}</h3>${e.meta?`<div class="meta">${esc(e.meta)}</div>`:''}<p>${esc(e.text||'')}</p></div>`).join('')}
function render(S,P){
  document.title=S.name+' — Portfolio';
  const T={hello:S.hello,name:S.name,year:S.year,ctitle:S.contact.title,ctext:S.contact.text,fl:S.footer_left,fr:S.footer_right};
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[e.dataset.t]||'');
  $('heroPhoto').src=S.hero_photo;$('aboutPhoto').src=S.about_photo;
  $('tagline').innerHTML=esc(S.tagline).replace(/\n/g,'<br>');
  $('aboutText').innerHTML=S.about.split(/\n\s*\n/).map(p=>`<p>${md(p)}</p>`).join('');
  $('contacts').innerHTML=S.contacts.map(c=>`<a class="pill" href="${esc(c.url)}">${esc(c.label)}</a>`).join('');
  const sk=S.skills.map((s,i)=>`<div class="sk"><span class="n">(0${i+1})</span><div><h4>${esc(s.title)}</h4><p>${esc(s.text)}</p></div></div>`);
  const h=Math.ceil(sk.length/2);$('sk1').innerHTML=sk.slice(0,h).join('');$('sk2').innerHTML=sk.slice(h).join('');
  $('soft').innerHTML=S.soft_skills.map(x=>`<li>${esc(x)}</li>`).join('');
  $('soft2').innerHTML=S.software.map(x=>`<span class="chip">${esc(x)}</span>`).join('');
  $('langs').innerHTML=S.languages.map(x=>`<span class="chip">${esc(x)}</span>`).join('');
  $('exp').innerHTML=items(S.experience);$('edul').innerHTML=items(S.education);
  $('lead').textContent=S.amazon_lead;
  $('cgrid').innerHTML=S.categories.map((c,i)=>{
    const inner=`<small>${esc(c.label)}</small><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p><span class="soon">${esc(c.action)}</span>`;
    if(c.link==='amazon')return `<button class="ccard" data-amz>${inner}</button>`;
    if(c.link)return `<a class="ccard" href="${esc(c.link)}">${inner}</a>`;
    return `<article class="ccard">${inner}</article>`}).join('');
  document.querySelectorAll('[data-amz]').forEach(b=>b.onclick=openAmazon);
  $('stats').innerHTML=S.stats.map(s=>`<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('');
  $('cbtn').textContent=S.contact.button;$('cbtn').href='mailto:'+S.contact.email;
  DATA=P.products;$('grid').innerHTML='';
  DATA.forEach((d,i)=>{
    const b=document.createElement('button');b.className='pcard';
    const n=KEYS.filter(k=>d[k]&&d[k].length).length;
    const cover=(d.listing&&d.listing[0])||(d.aplus&&d.aplus[0])||'';
    b.innerHTML=`<img loading="lazy" src="${esc(cover)}" alt="${esc(d.name)}"><h3>${esc(d.name)}</h3><small>${n} sets · Amazon</small>`;
    b.onclick=()=>openM(i);$('grid').appendChild(b)});
}
Promise.all([fetch('/content/site.json').then(r=>r.json()),fetch('/content/products.json').then(r=>r.json())]).then(([S,P])=>render(S,P)).catch(e=>{document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px">Failed to load content: '+e+'</p>')});
</script>
</body></html>
